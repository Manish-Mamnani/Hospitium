<div class="min-h-screen flex items-center justify-center bg-neutral-bg px-4 py-12">
  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="card-premium px-8 py-10">

      <!-- Header -->
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary mb-6 shadow-lg shadow-primary/20">
          <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-neutral-primary tracking-tight font-display">Welcome Back</h1>
        <p class="text-neutral-secondary mt-2 font-medium">Sign in to manage your bookings and properties.</p>
      </div>

      <form (ngSubmit)="onSubmit()" novalidate class="space-y-6">

        <!-- Email -->
        <div>
          <label for="email" class="block text-xs font-bold text-neutral-secondary uppercase tracking-widest mb-2">Email Address</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 [(ngModel)]="credentials.email"
                 (blur)="touch('email')"
                 [class.border-error-text]="emailError"
                 class="input-premium"
                 placeholder="you@example.com">
          <p *ngIf="emailError" class="mt-2 text-xs text-error-text font-bold flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            {{ emailError }}
          </p>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-xs font-bold text-neutral-secondary uppercase tracking-widest">Password</label>
            <a routerLink="/auth/forgot-password" class="text-xs text-primary hover:text-primary-hover font-bold transition-colors">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="password" name="password"
                   [type]="showPassword ? 'text' : 'password'"
                   autocomplete="current-password"
                   [(ngModel)]="credentials.password"
                   (blur)="touch('password')"
                   [class.border-error-text]="passwordError"
                   class="input-premium pr-12"
                   placeholder="Your secure password">
            <button type="button" (click)="showPassword = !showPassword"
                    class="absolute right-4 top-1/2 -translate-y-1/2 text-neutral-secondary hover:text-neutral-primary transition-colors">
              <svg *ngIf="!showPassword" class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg *ngIf="showPassword" class="w-5 h-5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
          <p *ngIf="passwordError" class="mt-2 text-xs text-error-text font-bold flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            {{ passwordError }}
          </p>
        </div>

        <!-- Server error -->
        <div *ngIf="errorMessage" class="bg-error-bg text-error-text rounded-xl px-4 py-4 text-sm flex items-start gap-3 border border-error-text/10 shadow-sm animate-fade-in">
          <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
          <span class="font-bold">{{ errorMessage }}</span>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="isLoading"
                class="btn-primary w-full py-4 text-base shadow-lg shadow-primary/20">
          <span *ngIf="isLoading" class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></span>
          {{ isLoading ? 'Signing in...' : 'Sign In' }}
        </button>

        <p class="text-center text-sm text-neutral-secondary font-medium">
          Don't have an account?
          <a routerLink="/auth/register" class="text-primary hover:text-primary-hover font-bold transition-colors">Join Hospitium</a>
        </p>

      </form>
    </div>
  </div>
</div>
