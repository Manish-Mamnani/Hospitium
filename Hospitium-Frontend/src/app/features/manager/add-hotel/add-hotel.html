<div class="flex min-h-[calc(100vh-5rem)] bg-gray-50">
  <!-- Sidebar -->
  <div class="w-64 bg-white border-r border-gray-100 hidden md:block border-t border-gray-100 flex-shrink-0">
    <div class="px-5 py-6">
      <p class="text-xs font-bold text-gray-400 mb-4 tracking-wider uppercase">Hotel Manager</p>
      <div class="space-y-1">
        <a routerLink="/manager" class="flex items-center px-3 py-2.5 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition-colors">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
          My Hotels
        </a>
        <a routerLink="/manager/add-hotel" routerLinkActive="bg-brand-100 text-brand-700 font-medium" class="flex items-center px-3 py-2.5 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition-colors">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          Add Hotel
        </a>
        <a routerLink="/manager/bookings" routerLinkActive="bg-brand-100 text-brand-700 font-medium" class="flex items-center px-3 py-2.5 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition-colors">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
          Property Bookings
        </a>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 p-8 overflow-y-auto">
    <div class="max-w-2xl">
      <div class="mb-8">
        <h1 class="text-3xl font-display font-semibold text-brand-900 tracking-tight">Add New Hotel</h1>
        <p class="text-gray-500 mt-2 text-sm">Submit your property for admin review and approval.</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <form (ngSubmit)="onSubmit()" novalidate class="space-y-6">

          <!-- Hotel Name -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Hotel Name <span class="text-red-500">*</span></label>
            <input type="text" [(ngModel)]="hotel.name" name="name" (blur)="touch('name')"
                   [class.border-red-400]="nameError"
                   [class.border-green-400]="touched.name && !nameError && hotel.name"
                   class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 text-sm placeholder-gray-400
                          focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                   placeholder="e.g. Grand Hyatt Mumbai">
            <p *ngIf="nameError" class="mt-1.5 text-xs text-red-600">{{ nameError }}</p>
          </div>

          <!-- City -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">City <span class="text-red-500">*</span></label>
            <input type="text" [(ngModel)]="hotel.city" name="city" (blur)="touch('city')"
                   [class.border-red-400]="cityError"
                   [class.border-green-400]="touched.city && !cityError && hotel.city"
                   class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 text-sm placeholder-gray-400
                          focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                   placeholder="e.g. Mumbai">
            <p *ngIf="cityError" class="mt-1.5 text-xs text-red-600">{{ cityError }}</p>
          </div>

          <!-- Description -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
            <textarea [(ngModel)]="hotel.description" name="description" rows="4" (blur)="touch('description')"
                      class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-gray-900 text-sm placeholder-gray-400
                             focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none"
                      placeholder="Describe your hotel, amenities, and what makes it special..."></textarea>
          </div>

          <!-- Info box -->
          <div class="bg-blue-50 rounded-xl px-4 py-3 text-xs text-blue-700 flex items-start gap-2">
            <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
            <span>Once approved by an admin, you can add rooms and pricing from the My Hotels page.</span>
          </div>

          <!-- Error -->
          <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm">
            {{ errorMessage }}
          </div>

          <!-- Actions -->
          <div class="flex justify-end gap-3 pt-2">
            <button type="button" (click)="router.navigate(['/manager'])"
                    class="px-5 py-2.5 rounded-xl border border-gray-300 text-gray-700 text-sm font-medium hover:bg-gray-50 transition-colors">
              Cancel
            </button>
            <button type="submit" [disabled]="isLoading"
                    class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white text-sm font-semibold transition-colors flex items-center gap-2">
              <span *ngIf="isLoading" class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
              {{ isLoading ? 'Submitting...' : 'Submit Hotel' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
