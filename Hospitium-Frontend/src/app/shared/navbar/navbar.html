<nav class="bg-primary/95 backdrop-blur-md border-b border-white/10 relative z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-20">
      
      <!-- Left side: Logo -->
      <div class="flex items-center">
        <!-- Logo Icon -->
        <a routerLink="/home" class="flex items-center space-x-3 group">
          <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center border border-white/20 shadow-sm group-hover:scale-105 transition-transform overflow-hidden">
            <img src="/logo.png" alt="Hospitium" class="w-full h-full object-cover">
          </div>
          <span class="text-2xl font-bold text-white tracking-tight font-display">Hospitium</span>
        </a>
      </div>

      <!-- Center: Links -->
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/home" routerLinkActive="text-white font-semibold" [routerLinkActiveOptions]="{exact: true}" class="text-white/80 hover:text-white px-1 py-2 text-base font-medium transition-all">Home</a>
        <a routerLink="/hotels/search" routerLinkActive="text-white font-semibold" class="text-white/80 hover:text-white px-1 py-2 text-base font-medium transition-all">Search</a>
      </div>

      <!-- Right: User Actions -->
      <div class="flex items-center space-x-6">
        <ng-container *ngIf="isAuthenticated">

          <!-- Profile Dropdown -->
          <div class="relative">
            <button (click)="toggleProfile()" class="flex items-center space-x-2 bg-white/10 hover:bg-white/20 text-white font-medium py-2 px-4 rounded-full transition-all border border-white/20 focus:outline-none focus:ring-2 focus:ring-white/30">
              <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center text-[10px] font-bold">
                {{ (fullName || 'U').substring(0, 1) }}
              </div>
              <span class="max-w-[100px] truncate hidden sm:inline">{{ fullName }}</span>
              <svg class="h-4 w-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div *ngIf="isProfileOpen" (clickOutside)="isProfileOpen = false" class="absolute right-0 mt-3 w-64 bg-white rounded-2xl shadow-xl ring-1 ring-black/5 py-3 transform transition-all border border-neutral-border animate-fade-in">
              
              <div class="px-5 py-2 mb-2 border-b border-neutral-border">
                <p class="text-xs font-bold text-neutral-secondary uppercase tracking-widest">Signed in as</p>
                <p class="text-sm font-bold text-neutral-primary truncate">{{ fullName }}</p>
              </div>

              <a routerLink="/bookings" (click)="isProfileOpen=false" class="group flex items-center px-5 py-4 text-sm text-neutral-primary hover:bg-neutral-bg transition-colors">
                <svg class="mr-3 h-5 w-5 text-neutral-secondary group-hover:text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                My Stays
              </a>

              <ng-container *ngIf="role === 'HotelManager'">
                <a routerLink="/manager" (click)="isProfileOpen=false" class="group flex items-center px-5 py-4 text-sm text-neutral-primary hover:bg-neutral-bg transition-colors">
                  <svg class="mr-3 h-5 w-5 text-neutral-secondary group-hover:text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                  My Hotels
                </a>
                <a routerLink="/manager/bookings" (click)="isProfileOpen=false" class="group flex items-center px-5 py-4 text-sm text-neutral-primary hover:bg-neutral-bg transition-colors">
                  <svg class="mr-3 h-5 w-5 text-neutral-secondary group-hover:text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                  Property Bookings
                </a>
              </ng-container>

              <a routerLink="/admin" *ngIf="role === 'Admin'" (click)="isProfileOpen=false" class="group flex items-center px-5 py-4 text-sm text-neutral-primary hover:bg-neutral-bg transition-colors">
                <svg class="mr-3 h-5 w-5 text-neutral-secondary group-hover:text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                Admin Dashboard
              </a>

              <hr class="my-2 border-neutral-border mx-4">

              <button (click)="logout(); isProfileOpen=false" class="w-full text-left group flex items-center px-5 py-4 text-sm text-error-text font-bold hover:bg-error-bg/10 transition-colors">
                <svg class="mr-3 h-5 w-5 opacity-70 group-hover:opacity-100" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                Sign Out
              </button>
            </div>
          </div>
        </ng-container>
        
        <ng-container *ngIf="!isAuthenticated">
          <a routerLink="/auth/login" class="bg-white text-primary font-bold px-8 py-3 rounded-2xl text-sm hover:bg-white/90 transition-all shadow-lg shadow-black/5">Sign In</a>
        </ng-container>
      </div>
      
    </div>
  </div>
</nav>
