<aside class="w-64 bg-neutral-sidebar border-r border-neutral-border h-screen sticky top-0 overflow-y-auto hidden lg:flex flex-col">
  <!-- Sidebar Header -->
  <div class="p-6 border-b border-neutral-border flex items-center space-x-3">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center overflow-hidden bg-white">
      <img src="/logo.png" alt="Hospitium" class="w-full h-full object-cover">
    </div>
    <span class="text-lg font-bold text-neutral-primary tracking-tight font-display">Hospitium</span>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 py-6 px-4 space-y-1">
    <a *ngFor="let item of filteredItems" 
       [routerLink]="item.link" 
       routerLinkActive="bg-primary text-white" 
       [routerLinkActiveOptions]="{exact: item.link === '/admin' || item.link === '/manager'}"
       class="flex items-center space-x-3 px-4 py-3 rounded-xl text-neutral-secondary font-medium transition-all hover:bg-primary/5 group">
      <svg class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity" fill="none" [attr.viewBox]="'0 0 24 24'" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
      </svg>
      <span>{{ item.label }}</span>
      
      <!-- Active Indicator Dot -->
      <div class="ml-auto w-1.5 h-1.5 rounded-full bg-white opacity-0 transition-opacity" 
           routerLinkActive="opacity-100"
           [routerLinkActiveOptions]="{exact: item.link === '/admin' || item.link === '/manager'}"></div>
    </a>
  </nav>

  <!-- User Info / Footer -->
  <div class="p-4 border-t border-neutral-border bg-neutral-bg/50">
    <div class="flex items-center space-x-3 px-2 py-2">
      <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center text-primary font-bold text-xs uppercase">
        {{ role ? role.substring(0, 2) : 'U' }}
      </div>
      <div class="overflow-hidden">
        <p class="text-sm font-semibold text-neutral-primary truncate">{{ role || 'User' }}</p>
        <p class="text-xs text-neutral-secondary truncate">Active session</p>
      </div>
    </div>
  </div>
</aside>
