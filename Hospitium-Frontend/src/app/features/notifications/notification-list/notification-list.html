<div class="max-w-4xl mx-auto py-12 px-4 sm:px-6 mt-4">
  <h1 class="text-4xl font-display font-semibold text-brand-900 mb-10 tracking-tight text-center sm:text-left">Notifications & Email Templates</h1>

  <!-- Notifications List -->
  <div class="space-y-5">
    <div *ngFor="let notification of notifications" class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm transition-all hover:shadow-md flex items-start gap-5 cursor-default relative overflow-hidden" [class.opacity-70]="notification.read">
      
      <!-- Icon Container -->
      <div class="flex-shrink-0">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center"
             [ngClass]="{
               'bg-brand-100 text-brand-600': !notification.type || notification.type === 'welcome' || notification.type === 'system',
               'bg-emerald-50 text-emerald-500': notification.type === 'booking' || notification.type === 'approval' || notification.type === 'success',
               'bg-rose-50 text-rose-500': notification.type === 'cancellation' || notification.type === 'error'
             }">
          <!-- User / System / Welcome Icon -->
          <svg *ngIf="!notification.type || notification.type === 'welcome' || notification.type === 'system'" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          <!-- Success / Booking Icon -->
          <svg *ngIf="notification.type === 'booking' || notification.type === 'approval' || notification.type === 'success'" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          <!-- Error / Cancellation Icon -->
          <svg *ngIf="notification.type === 'cancellation' || notification.type === 'error'" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </div>
      </div>

      <!-- Content -->
      <div class="flex-1 min-w-0 pt-1">
        <div class="flex items-center">
          <h3 class="text-lg font-semibold text-gray-900 truncate mr-2">{{ notification.message.split('\n')[0] || notification.message }}</h3>
          <div *ngIf="!notification.read" class="w-2.5 h-2.5 bg-brand-600 rounded-full flex-shrink-0 animate-pulse"></div>
        </div>
        <p class="text-gray-500 mt-1 mb-2">Your notification details go here or fetched from the API...</p>
        <p class="text-xs text-gray-400 font-medium">{{ notification.date | date:'short' }}</p>
      </div>

      <!-- Action -->
      <div class="flex-shrink-0 ml-4 hidden sm:block">
        <button *ngIf="!notification.read" (click)="markAsRead(notification.id)"
                class="text-brand-600 hover:text-brand-800 text-sm font-medium transition-colors px-3 py-1.5 rounded-lg hover:bg-brand-50">
          Mark as read
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="notifications.length === 0" class="text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm mt-4">
    <svg class="mx-auto w-12 h-12 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
    <p class="text-gray-500 text-lg">You have no new notifications.</p>
  </div>
</div>
