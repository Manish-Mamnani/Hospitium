<nav class="bg-white border-b border-gray-100 relative z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-20">
      
      <!-- Left side: Logo -->
      <div class="flex items-center">
        <!-- Logo Icon -->
        <a routerLink="/home" class="flex items-center space-x-3 group">
          <div class="w-10 h-10 bg-brand-900 rounded-xl flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
            <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          </div>
          <span class="text-2xl font-bold text-brand-900 tracking-tight font-display">Hospitium</span>
        </a>
      </div>

      <!-- Center: Links -->
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/home" routerLinkActive="text-brand-900 font-semibold" [routerLinkActiveOptions]="{exact: true}" class="text-gray-500 hover:text-brand-900 px-1 py-2 text-base font-medium transition-colors">Home</a>
        <a routerLink="/hotels/search" routerLinkActive="text-brand-900 font-semibold" class="text-gray-500 hover:text-brand-900 px-1 py-2 text-base font-medium transition-colors">Search</a>
      </div>

      <!-- Right: User Actions -->
      <div class="flex items-center space-x-6">
        <ng-container *ngIf="isAuthenticated">

          <!-- Profile Dropdown -->
          <div class="relative">
            <button (click)="toggleProfile()" class="flex items-center space-x-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium py-2 px-4 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span>{{ fullName }}</span>
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div *ngIf="isProfileOpen" class="absolute right-0 mt-3 w-56 bg-white rounded-xl shadow-lg ring-1 ring-black ring-opacity-5 py-2 transform opacity-100 scale-100 transition-all origin-top-right">
              
              <a routerLink="/bookings" (click)="isProfileOpen=false" class="group flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 hover:text-brand-900 transition-colors">
                <svg class="mr-3 h-5 w-5 text-gray-400 group-hover:text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                My Bookings
              </a>
              <a routerLink="/manager" *ngIf="role === 'HotelManager'" (click)="isProfileOpen=false" class="group flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 hover:text-brand-900 transition-colors">
                <svg class="mr-3 h-5 w-5 text-gray-400 group-hover:text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                Manager Panel
              </a>
              <a routerLink="/admin" *ngIf="role === 'Admin'" (click)="isProfileOpen=false" class="group flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 hover:text-brand-900 transition-colors">
                <svg class="mr-3 h-5 w-5 text-gray-400 group-hover:text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                Admin Panel
              </a>

              <button (click)="logout(); isProfileOpen=false" class="w-full text-left group flex items-center px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors mt-1">
                <svg class="mr-3 h-5 w-5 text-red-400 group-hover:text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                Sign Out
              </button>
            </div>
          </div>
        </ng-container>
        
        <ng-container *ngIf="!isAuthenticated">
          <a routerLink="/auth/login" class="text-brand-900 font-medium hover:text-brand-700 px-4 py-2 transition-colors">Sign In</a>
        </ng-container>
      </div>
      
    </div>
  </div>
</nav>
