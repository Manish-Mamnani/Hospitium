<div class="am-page">
  <app-sidebar role="Admin"></app-sidebar>

  <div class="am-content">
    <div class="am-inner">
      
      <div class="am-header">
        <h1 class="am-title">Platform Managers</h1>
        <p class="am-subtitle">Manage all registered hotel managers on the platform.</p>
      </div>

      <div class="am-table-card">
        <div class="am-table-scroll">
          <table class="am-table">
            <thead>
              <tr class="am-thead-row">
                <th class="am-th">Manager Info</th>
                <th class="am-th">Role</th>
                <th class="am-th-right">Registered On</th>
              </tr>
            </thead>
            <tbody class="am-tbody">
              <tr *ngFor="let m of managers" class="am-tr">
                <td class="am-td">
                  <div class="am-manager-name">{{ m.fullName }}</div>
                  <div class="am-manager-email">{{ m.email }}</div>
                </td>
                <td class="am-td">
                  <span class="badge-active">{{ m.role }}</span>
                </td>
                <td class="am-td-right">
                  <span class="am-date">{{ m.createdAt | date:'mediumDate' }}</span>
                </td>
              </tr>
              
              <tr *ngIf="managers.length === 0 && !isLoading">
                <td colspan="3" class="am-td text-center text-neutral-secondary italic py-20">
                  No managers registered on the platform yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Loading -->
        <div *ngIf="isLoading" class="am-loading">
          <div class="am-spinner"></div>
        </div>
      </div>
    </div>
  </div>
</div>
