<div class="auth-page">
  <div class="auth-card-wrap">

    <!-- Card -->
    <div class="auth-card">

      <!-- Header -->
      <div class="auth-header-sm">
        <div class="auth-icon-wrap">
          <svg class="auth-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join our community of travelers and hosts.</p>
      </div>

      <form (ngSubmit)="onSubmit()" novalidate class="auth-form-sm">

        <!-- Full Name -->
        <div class="auth-field">
          <label for="name" class="auth-label">Full Name</label>
          <input id="name" name="name" type="text" autocomplete="name"
                 [(ngModel)]="user.name"
                 (blur)="touch('name')"
                 [class.border-error-text]="nameError"
                 class="input-premium"
                 placeholder="John Doe">
          <p *ngIf="nameError" class="auth-error-text-simple">
            {{ nameError }}
          </p>
        </div>

        <!-- Email -->
        <div class="auth-field">
          <label for="email" class="auth-label">Email Address</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 [(ngModel)]="user.email"
                 (blur)="touch('email')"
                 [class.border-error-text]="emailError"
                 class="input-premium"
                 placeholder="you@example.com">
          <p *ngIf="emailError" class="auth-error-text-simple">
            {{ emailError }}
          </p>
        </div>

        <!-- Role -->
        <div class="auth-field">
          <label for="role" class="auth-label">I am a</label>
          <select id="role" name="role" [(ngModel)]="user.role"
                  class="reg-role-select input-premium">
            <option value="User">Guest / Traveler</option>
            <option value="HotelManager">Hotel Manager</option>
          </select>
        </div>

        <!-- Password -->
        <div class="auth-field">
          <label for="password" class="auth-label">Password</label>
          <div class="auth-input-wrap">
            <input id="password" name="password"
                   [type]="showPassword ? 'text' : 'password'"
                   autocomplete="new-password"
                   [(ngModel)]="user.password"
                   (blur)="touch('password')"
                   [class.border-error-text]="passwordError"
                   class="input-premium pr-12"
                   placeholder="Create a strong password">
            <button type="button" (click)="showPassword = !showPassword" class="auth-toggle-pwd">
              <svg *ngIf="!showPassword" class="auth-toggle-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>

          <!-- Password rules hint -->
          <div *ngIf="!user.password" class="auth-pwd-hint">
            <p class="auth-pwd-hint-title">Requirements:</p>
            <div class="auth-pwd-hint-grid">
              <span>• 8+ characters</span>
              <span>• 1 Uppercase</span>
              <span>• 1 Number</span>
              <span>• No spaces</span>
            </div>
          </div>
          
          <p *ngIf="passwordError" class="auth-error-text-simple">
            {{ passwordError }}
          </p>
        </div>

        <!-- Server error -->
        <div *ngIf="errorMessage" class="auth-error-banner-simple">
          {{ errorMessage }}
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="isLoading"
                class="btn-primary w-full py-4 text-base shadow-lg shadow-primary/20 mt-4">
          <span *ngIf="isLoading" class="auth-spinner"></span>
          {{ isLoading ? 'Creating account...' : 'Create Account' }}
        </button>

        <p class="auth-footer-text">
          Already have an account?
          <a routerLink="/auth/login" class="auth-footer-link">Sign In</a>
        </p>

      </form>
    </div>
  </div>
</div>
