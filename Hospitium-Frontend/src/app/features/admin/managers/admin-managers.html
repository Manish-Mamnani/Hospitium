<div class="flex bg-neutral-bg min-h-screen">
  <app-sidebar role="Admin"></app-sidebar>

  <div class="flex-1 overflow-auto">
    <div class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8 animate-fade-in">
      
      <div class="mb-10">
        <h1 class="text-3xl font-bold tracking-tight">Platform Managers</h1>
        <p class="text-neutral-secondary mt-1">Manage all registered hotel managers on the platform.</p>
      </div>

      <div class="card-premium overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="text-xs font-bold text-neutral-secondary uppercase tracking-wider border-b border-neutral-border bg-neutral-bg/30">
                <th class="px-6 py-4">Manager Info</th>
                <th class="px-6 py-4">Role</th>
                <th class="px-6 py-4 text-right">Registered On</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-neutral-border">
              <tr *ngFor="let m of managers" class="hover:bg-neutral-bg/20 transition-colors group">
                <td class="px-6 py-4">
                  <div class="text-sm font-bold text-neutral-primary">{{ m.fullName }}</div>
                  <div class="text-xs text-neutral-secondary">{{ m.email }}</div>
                </td>
                <td class="px-6 py-4">
                  <span class="badge-active">{{ m.role }}</span>
                </td>
                <td class="px-6 py-4 text-right">
                  <span class="text-xs text-neutral-secondary font-medium">{{ m.createdAt | date:'mediumDate' }}</span>
                </td>
              </tr>
              
              <tr *ngIf="managers.length === 0 && !isLoading">
                <td colspan="3" class="px-6 py-20 text-center text-neutral-secondary italic">
                  No managers registered on the platform yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Loading -->
        <div *ngIf="isLoading" class="p-20 flex justify-center bg-white/50 backdrop-blur-sm">
          <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary"></div>
        </div>
      </div>
    </div>
  </div>
</div>
