<div class="toast-wrapper">
  <div *ngFor="let toast of toasts; let i = index"
       class="toast-item"
       [ngClass]="getToastClass(toast.type)">
    <!-- Icon -->
    <div class="toast-icon-container">
      <svg *ngIf="toast.type === 'success'" class="toast-icon-success" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <svg *ngIf="toast.type === 'error'" class="toast-icon-error" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <svg *ngIf="toast.type === 'info'" class="toast-icon-info" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <!-- Message -->
    <p class="toast-message">{{ toast.message }}</p>
    <!-- Close button -->
    <button (click)="remove(i)" class="toast-close-btn">
      <svg class="toast-close-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
