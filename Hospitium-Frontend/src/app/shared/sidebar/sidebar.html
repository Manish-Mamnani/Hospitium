<aside class="sidebar-wrapper">
  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <div class="sidebar-logo-container">
      <img src="/logo.png" alt="Hospitium" class="sidebar-logo-img">
    </div>
    <span class="sidebar-title">Hospitium</span>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <a *ngFor="let item of filteredItems" 
       [routerLink]="item.link" 
       routerLinkActive="bg-primary text-white" 
       [routerLinkActiveOptions]="{exact: item.link === '/admin' || item.link === '/manager'}"
       class="sidebar-link">
      <svg class="sidebar-link-icon" fill="none" [attr.viewBox]="'0 0 24 24'" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
      </svg>
      <span>{{ item.label }}</span>
      
      <!-- Active Indicator Dot -->
      <div class="sidebar-link-active-dot" 
           routerLinkActive="opacity-100"
           [routerLinkActiveOptions]="{exact: item.link === '/admin' || item.link === '/manager'}"></div>
    </a>
  </nav>

  <!-- User Info / Footer -->
  <div class="sidebar-footer">
    <div class="sidebar-footer-content">
      <div class="sidebar-avatar">
        {{ role ? role.substring(0, 2) : 'U' }}
      </div>
      <div class="sidebar-user-info">
        <p class="sidebar-user-role">{{ role || 'User' }}</p>
        <p class="sidebar-user-status">Active session</p>
      </div>
    </div>
  </div>
</aside>
