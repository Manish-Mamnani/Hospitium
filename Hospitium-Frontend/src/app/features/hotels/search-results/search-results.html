<div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 mt-4">
  
  <div class="flex flex-col md:flex-row md:items-end justify-between mb-10">
    <div>
      <h1 class="text-4xl font-display font-semibold text-brand-900 tracking-tight">Search Results</h1>
      <p class="text-gray-500 mt-2">Showing {{ hotels.length || 0 }} hotels <span *ngIf="filters.city">in {{filters.city}}</span></p>
    </div>
    
    <div class="mt-6 md:mt-0 flex items-center space-x-4">
      <div class="relative">
        <select [(ngModel)]="filters.sortBy" (change)="applyFilters()" class="appearance-none bg-white border border-gray-200 text-gray-700 py-2.5 pl-4 pr-10 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 shadow-sm text-sm font-medium">
          <option value="price">Price: Low to High</option>
          <option value="-price">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Optional Hidden Filters (kept for Logic binding) -->
  <div class="hidden">
    <input type="text" [(ngModel)]="filters.city" (input)="applyFilters()">
    <input type="number" [(ngModel)]="filters.minPrice" (input)="applyFilters()">
    <input type="number" [(ngModel)]="filters.maxPrice" (input)="applyFilters()">
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    <div *ngFor="let i of [1,2,3,4,5,6]" class="animate-pulse bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 p-2">
      <div class="bg-gray-200 h-56 rounded-2xl mb-4"></div>
      <div class="px-2 pb-2">
        <div class="bg-gray-200 h-5 w-3/4 rounded-md mb-2"></div>
        <div class="bg-gray-200 h-4 w-1/2 rounded-md mb-6"></div>
        <div class="flex justify-between items-center">
          <div class="bg-gray-200 h-6 w-1/3 rounded-md"></div>
          <div class="bg-gray-200 h-8 w-20 rounded-xl"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="bg-rose-50 border border-rose-100 text-rose-600 p-6 rounded-2xl text-center shadow-sm">
    <svg class="mx-auto w-8 h-8 mb-2 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    {{ errorMessage }}
  </div>

  <!-- Hotels Grid -->
  <div *ngIf="!isLoading && !errorMessage" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    
    <div *ngFor="let hotel of hotels; let i = index" class="bg-white rounded-[24px] shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 hover:-translate-y-1 overflow-hidden p-2 group">
      
      <!-- Image/Gradient Placeholder with Badges -->
      <div class="relative h-64 rounded-[20px] overflow-hidden" 
           [ngClass]="[
             i % 4 === 0 ? 'bg-gradient-to-br from-indigo-800 to-indigo-950' : 
             i % 4 === 1 ? 'bg-gradient-to-br from-rose-600 to-rose-800' : 
             i % 4 === 2 ? 'bg-gradient-to-br from-amber-600 to-amber-700' : 
             'bg-gradient-to-br from-emerald-600 to-emerald-800'
           ]">
        <!-- Rating Badge -->
        <div class="absolute top-4 right-4 bg-white/20 backdrop-blur-md text-white px-2.5 py-1 rounded-full flex items-center shadow-sm text-sm font-medium border border-white/10">
          <svg class="w-3.5 h-3.5 text-yellow-300 mr-1" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>
          4.9
        </div>
        <!-- Location Pin -->
        <div class="absolute bottom-4 left-4 text-white/90 flex items-center text-sm font-medium">
          <svg class="w-4 h-4 mr-1.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
          {{ hotel.city || 'Napa Valley' }}
        </div>
      </div>

      <!-- Card Body -->
      <div class="p-5">
        <h3 class="text-xl font-bold text-gray-900 group-hover:text-brand-600 transition-colors">{{ hotel.name }}</h3>
        <p class="text-sm text-gray-500 mt-1 font-medium">94 reviews</p>
        
        <div class="mt-6 flex items-end justify-between">
          <div>
            <span class="text-2xl font-black text-brand-900 tracking-tight">₹{{ hotel.minPrice }}</span>
            <span class="text-gray-400 text-sm font-medium ml-1">/ night</span>
          </div>
          <button class="bg-brand-100 text-brand-900 font-semibold px-6 py-2 rounded-xl text-sm hover:bg-brand-600 hover:text-white transition-colors duration-300" [routerLink]="['/hotels', hotel.hotelId]">
            View
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- No results -->
  <div *ngIf="!isLoading && !errorMessage && hotels.length === 0" class="bg-white rounded-[24px] p-16 text-center shadow-sm border border-gray-100">
    <svg class="mx-auto w-16 h-16 text-gray-200 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" /></svg>
    <h3 class="text-xl font-semibold text-gray-900 mb-2">No hotels found</h3>
    <p class="text-gray-500">We couldn't find any hotels matching your current filters.</p>
  </div>

</div>
