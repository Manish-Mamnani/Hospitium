<nav class="navbar-wrapper">
  <div class="navbar-container">
    <div class="navbar-content">
      
      <!-- Left side: Logo -->
      <div class="navbar-left">
        <!-- Logo Icon -->
        <a routerLink="/home" class="navbar-logo-link">
          <div class="navbar-logo-icon-parent">
            <img src="/logo.png" alt="Hospitium" class="navbar-logo-img">
          </div>
          <span class="navbar-title">Hospitium</span>
        </a>
      </div>

      <!-- Center: Links -->
      <div class="navbar-center">
        <a routerLink="/home" routerLinkActive="text-white font-semibold" [routerLinkActiveOptions]="{exact: true}" class="navbar-link">Home</a>
        <a routerLink="/hotels/search" routerLinkActive="text-white font-semibold" class="navbar-link">Search</a>
      </div>

      <!-- Right: User Actions -->
      <div class="navbar-right">
        <ng-container *ngIf="isAuthenticated">

          <!-- Profile Dropdown -->
          <div class="relative">
            <button (click)="toggleProfile()" class="navbar-profile-btn">
              <div class="navbar-profile-avatar">
                {{ (fullName || 'U').substring(0, 1) }}
              </div>
              <span class="navbar-profile-name">{{ fullName }}</span>
              <svg class="navbar-profile-chevron" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div *ngIf="isProfileOpen" (clickOutside)="isProfileOpen = false" class="navbar-dropdown">
              
              <div class="navbar-dropdown-header">
                <p class="navbar-dropdown-header-label">Signed in as</p>
                <p class="navbar-dropdown-header-name">{{ fullName }}</p>
              </div>

              <a routerLink="/bookings" (click)="isProfileOpen=false" class="navbar-dropdown-link">
                <svg class="navbar-dropdown-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                My Stays
              </a>

              <ng-container *ngIf="role === 'HotelManager'">
                <a routerLink="/manager" (click)="isProfileOpen=false" class="navbar-dropdown-link">
                  <svg class="navbar-dropdown-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                  My Hotels
                </a>
                <a routerLink="/manager/bookings" (click)="isProfileOpen=false" class="navbar-dropdown-link">
                  <svg class="navbar-dropdown-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                  Property Bookings
                </a>
              </ng-container>

              <a routerLink="/admin" *ngIf="role === 'Admin'" (click)="isProfileOpen=false" class="navbar-dropdown-link">
                <svg class="navbar-dropdown-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                Admin Dashboard
              </a>

              <hr class="navbar-dropdown-divider">

              <button (click)="logout(); isProfileOpen=false" class="navbar-dropdown-logout-btn">
                <svg class="navbar-dropdown-logout-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                Sign Out
              </button>
            </div>
          </div>
        </ng-container>
        
        <ng-container *ngIf="!isAuthenticated">
          <a routerLink="/auth/login" class="navbar-signin-btn">Sign In</a>
        </ng-container>
      </div>
      
    </div>
  </div>
</nav>
