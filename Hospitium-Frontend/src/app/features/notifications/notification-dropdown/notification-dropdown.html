<div class="nd-wrap">
  <button (click)="toggleDropdown()" class="nd-trigger">
    <svg class="nd-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-5 5v-5zM4.868 12.683A17.925 17.925 0 0112 21c7.962 0 12-1.21 12-2.683m-12 2.683a17.925 17.925 0 01-7.132-8.317M12 21V9a6 6 0 10-12 0v12"></path>
    </svg>
    <span *ngIf="unreadCount > 0" class="nd-badge">
      {{ unreadCount }}
    </span>
  </button>

  <div *ngIf="isOpen" class="nd-dropdown">
    <div class="nd-list">
      <div class="nd-list-header">
        <h3 class="nd-list-title">Notifications</h3>
      </div>

      <div class="nd-list-body">
        <div *ngFor="let notification of notifications.slice(0, 5)" class="nd-item">
          <div class="nd-item-row">
            <div class="nd-item-left">
              <p class="nd-item-msg">{{ notification.message }}</p>
              <p class="nd-item-date">{{ notification.date | date:'short' }}</p>
            </div>
            <div class="nd-item-right">
              <span class="nd-type-badge"
                    [class]="notification.type === 'booking' ? 'nd-type-booking' :
                           notification.type === 'approval' ? 'nd-type-approval' :
                           'nd-type-other'">
                {{ notification.type }}
              </span>
              <button *ngIf="!notification.read" (click)="markAsRead(notification.id)"
                      class="nd-mark-read">
                ✓
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="nd-footer">
        <button (click)="viewAll()" class="nd-view-all">
          View all notifications
        </button>
      </div>
    </div>
  </div>
</div>
