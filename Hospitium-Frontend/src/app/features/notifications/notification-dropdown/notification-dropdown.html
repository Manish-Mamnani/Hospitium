<div class="relative">
  <button (click)="toggleDropdown()"
          class="relative p-2 text-gray-600 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded-md">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-5 5v-5zM4.868 12.683A17.925 17.925 0 0112 21c7.962 0 12-1.21 12-2.683m-12 2.683a17.925 17.925 0 01-7.132-8.317M12 21V9a6 6 0 10-12 0v12"></path>
    </svg>
    <span *ngIf="unreadCount > 0"
          class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
      {{ unreadCount }}
    </span>
  </button>

  <div *ngIf="isOpen"
       class="absolute right-0 mt-2 w-80 bg-white rounded-md shadow-lg ring-1 ring-black ring-opacity-5 z-50">
    <div class="py-1">
      <div class="px-4 py-2 border-b border-gray-200">
        <h3 class="text-sm font-medium text-gray-900">Notifications</h3>
      </div>

      <div class="max-h-64 overflow-y-auto">
        <div *ngFor="let notification of notifications.slice(0, 5)"
             class="px-4 py-3 border-b border-gray-100 last:border-b-0 hover:bg-gray-50">
          <div class="flex justify-between items-start">
            <div class="flex-1 min-w-0">
              <p class="text-sm text-gray-900 truncate">{{ notification.message }}</p>
              <p class="text-xs text-gray-500 mt-1">{{ notification.date | date:'short' }}</p>
            </div>
            <div class="flex items-center space-x-2 ml-2">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium"
                    [class]="notification.type === 'booking' ? 'bg-blue-100 text-blue-800' :
                           notification.type === 'approval' ? 'bg-green-100 text-green-800' :
                           'bg-gray-100 text-gray-800'">
                {{ notification.type }}
              </span>
              <button *ngIf="!notification.read" (click)="markAsRead(notification.id)"
                      class="text-indigo-600 hover:text-indigo-900 text-xs">
                ✓
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="px-4 py-2 border-t border-gray-200">
        <button (click)="viewAll()"
                class="text-sm text-indigo-600 hover:text-indigo-900 font-medium">
          View all notifications
        </button>
      </div>
    </div>
  </div>
</div>
