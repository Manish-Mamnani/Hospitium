<div class="nl-page">
  <h1 class="nl-title">Notifications &amp; Email Templates</h1>

  <!-- Notifications List -->
  <div class="nl-list">
    <div *ngFor="let notification of notifications" class="nl-item" [class.nl-item-read]="notification.read">
      
      <!-- Icon Container -->
      <div class="nl-icon-wrap">
        <div class="nl-icon-box"
             [ngClass]="{
               'nl-icon-default': !notification.type || notification.type === 'welcome' || notification.type === 'system',
               'nl-icon-success': notification.type === 'booking' || notification.type === 'approval' || notification.type === 'success',
               'nl-icon-error': notification.type === 'cancellation' || notification.type === 'error'
             }">
          <!-- User / System / Welcome Icon -->
          <svg *ngIf="!notification.type || notification.type === 'welcome' || notification.type === 'system'" class="nl-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          <!-- Success / Booking Icon -->
          <svg *ngIf="notification.type === 'booking' || notification.type === 'approval' || notification.type === 'success'" class="nl-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          <!-- Error / Cancellation Icon -->
          <svg *ngIf="notification.type === 'cancellation' || notification.type === 'error'" class="nl-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </div>
      </div>

      <!-- Content -->
      <div class="nl-body">
        <div class="nl-title-row">
          <h3 class="nl-msg-title">{{ notification.message.split('\n')[0] || notification.message }}</h3>
          <div *ngIf="!notification.read" class="nl-unread-dot"></div>
        </div>
        <p class="nl-msg-text">Your notification details go here or fetched from the API...</p>
        <p class="nl-date">{{ notification.date | date:'short' }}</p>
      </div>

      <!-- Action -->
      <div class="nl-action">
        <button *ngIf="!notification.read" (click)="markAsRead(notification.id)" class="nl-mark-btn">
          Mark as read
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="notifications.length === 0" class="nl-empty">
    <svg class="nl-empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
    <p class="nl-empty-text">You have no new notifications.</p>
  </div>
</div>
