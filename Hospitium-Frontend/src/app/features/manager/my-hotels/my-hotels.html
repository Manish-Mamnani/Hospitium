<div class="flex bg-neutral-bg min-h-screen">
  <app-sidebar role="HotelManager"></app-sidebar>

  <div class="flex-1 overflow-auto">
    <div class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8 animate-fade-in">
      
      <div class="flex items-center justify-between mb-10">
        <div>
          <h1 class="text-3xl font-bold tracking-tight">My Properties</h1>
          <p class="text-neutral-secondary mt-1">Manage your hotel listings and bookings here.</p>
        </div>
        <button (click)="addHotel()" class="btn-primary">
          <svg class="w-5 h-5 mr-2 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Add New Hotel
        </button>
      </div>

      <!-- Loading Skeleton -->
      <div *ngIf="isLoading()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let i of [1,2,3]" class="animate-pulse card-premium p-4">
          <div class="bg-neutral-bg h-48 rounded-xl mb-4"></div>
          <div class="space-y-3">
            <div class="h-6 bg-neutral-bg rounded w-3/4"></div>
            <div class="h-4 bg-neutral-bg rounded w-1/2"></div>
          </div>
        </div>
      </div>

      <!-- Hotels Grid -->
      <div *ngIf="!isLoading() && hotels().length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let hotel of hotels()" class="card-premium group">
          <div class="p-3">
             <div class="h-48 rounded-xl overflow-hidden bg-neutral-bg relative">
                <img [src]="hotel.imageUrl || '/assets/hotel-placeholder.jpg'" 
                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                     onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
                <div class="absolute top-3 left-3">
                   <span class="badge-success" *ngIf="hotel.status === 'Approved'">Approved</span>
                   <span class="badge-warning" *ngIf="hotel.status !== 'Approved'">Pending Review</span>
                </div>
             </div>
          </div>

          <div class="p-6 pt-2 flex-1 flex flex-col">
            <h3 class="text-xl font-bold text-neutral-primary group-hover:text-primary transition-colors truncate">{{ hotel.name }}</h3>
            <p class="text-sm text-neutral-secondary mt-1 flex items-center">
               <svg class="w-4 h-4 mr-1 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
               {{ hotel.city }}
            </p>

            <!-- Description summary -->
            <p class="text-sm text-neutral-secondary/80 mt-4 line-clamp-2 italic">
               {{ hotel.description || 'Modern hotel with all amenities for a comfortable stay.' }}
            </p>

            <div class="mt-6 flex flex-wrap gap-2 border-t border-neutral-border pt-4">
               <button *ngIf="hotel.status === 'Approved'" (click)="manageRooms(hotel.hotelId)" 
                       class="flex-[2] px-3 py-2 bg-primary text-white border border-primary rounded-lg text-xs font-bold hover:bg-primary-hover transition-all flex items-center justify-center gap-2">
                 <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/></svg>
                 Add Room
               </button>
               <button (click)="editHotel(hotel.hotelId)" class="flex-1 px-3 py-2 bg-neutral-bg border border-neutral-border text-neutral-primary rounded-lg text-xs font-bold hover:bg-neutral-border transition-all">Edit</button>
               <button [routerLink]="['/hotels', hotel.hotelId]" class="flex-1 px-3 py-2 bg-neutral-bg border border-neutral-border text-neutral-secondary rounded-lg text-xs font-bold hover:bg-neutral-border transition-all">View</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="!isLoading() && hotels().length === 0" class="card-premium p-16 text-center">
         <div class="w-20 h-20 bg-neutral-bg rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-neutral-secondary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
         </div>
         <h3 class="text-xl font-bold">No hotels registered</h3>
         <p class="text-neutral-secondary mt-2 max-w-xs mx-auto">Get started by adding your first hotel property to the platform.</p>
         <button (click)="addHotel()" class="btn-primary mt-8">Add Your First Hotel</button>
      </div>

    </div>
  </div>
</div>
