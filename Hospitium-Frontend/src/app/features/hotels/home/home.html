<div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white">
  <div class="max-w-7xl mx-auto py-16 px-4 sm:py-24 sm:px-6 lg:px-8">
    <div class="text-center">
      <h1 class="text-4xl font-extrabold sm:text-5xl md:text-6xl">Find your perfect stay</h1>
      <p class="mt-3 max-w-md mx-auto text-base sm:text-lg md:mt-5 md:text-xl md:max-w-3xl">
        Discover amazing hotels and book your next adventure with Hospitium.
      </p>
    </div>
    <div class="mt-10 max-w-md mx-auto sm:max-w-lg md:mt-12 md:max-w-3xl">
      <form (ngSubmit)="onSearch()" class="bg-white rounded-lg shadow-lg p-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div>
          <label for="city" class="block text-sm font-medium text-gray-700">City</label>
          <input type="text" id="city" [(ngModel)]="searchQuery.city" name="city" class="text-gray-900 mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" placeholder="Where are you going?">
        </div>
        <div>
          <label for="checkIn" class="block text-sm font-medium text-gray-700">Check-in</label>
          <input type="date" id="checkIn" [(ngModel)]="searchQuery.checkIn" name="checkIn" class="text-gray-900 mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
          <label for="checkOut" class="block text-sm font-medium text-gray-700">Check-out</label>
          <input type="date" id="checkOut" [(ngModel)]="searchQuery.checkOut" name="checkOut" class="text-gray-900 mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
          <label for="guests" class="block text-sm font-medium text-gray-700">Guests</label>
          <input type="number" id="guests" [(ngModel)]="searchQuery.guests" name="guests" min="1" class="text-gray-900 mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div class="sm:col-span-2 lg:col-span-4">
          <button type="submit" class="w-full bg-indigo-600 border border-transparent rounded-md py-2 px-4 text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Search Hotels
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
  <h2 class="text-3xl font-extrabold text-gray-900 mb-8">Featured Hotels</h2>
  <div *ngIf="isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let i of [1,2,3,4,5,6]" class="animate-pulse">
      <div class="bg-gray-300 h-48 rounded-lg"></div>
      <div class="mt-4 space-y-2">
        <div class="bg-gray-300 h-4 rounded"></div>
        <div class="bg-gray-300 h-4 w-3/4 rounded"></div>
      </div>
    </div>
  </div>
  <div *ngIf="!isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let hotel of featuredHotels" class="bg-white overflow-hidden shadow rounded-lg">
      <div class="h-48 bg-gray-200 flex items-center justify-center">
        <span class="text-gray-500">Hotel Image</span>
      </div>
      <div class="p-6">
        <h3 class="text-lg font-medium text-gray-900">{{ hotel.name }}</h3>
        <p class="text-sm text-gray-500">{{ hotel.city }}</p>
        <p class="mt-2 text-sm text-gray-600">{{ hotel.city }}</p>
        <div class="mt-4 flex items-center justify-between">
          <span class="text-lg font-bold text-gray-900">₹{{ hotel.minPrice }}/night</span>
          <button class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700" [routerLink]="['/hotels', hotel.hotelId]">
            View Details
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
